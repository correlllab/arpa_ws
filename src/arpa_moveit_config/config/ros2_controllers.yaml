# ROS2 Controllers configuration for ARPA system
# This config file is used by ros2_control for Gazebo simulation

controller_manager:
  ros__parameters:
    update_rate: 100  # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    joint_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    linear_actuator_controller:
      type: position_controllers/JointPositionController

joint_state_broadcaster:
  ros__parameters:
    publish_rate: 100.0  # Hz

joint_trajectory_controller:
  ros__parameters:
    joints:
      - shoulder_pan_joint
      - shoulder_lift_joint
      - elbow_joint
      - wrist_1_joint
      - wrist_2_joint
      - wrist_3_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    state_publish_rate: 100.0
    action_monitor_rate: 20.0
    allow_partial_joints_goal: false
    constraints:
      stopped_velocity_tolerance: 0.2
      goal_time: 0.0

linear_actuator_controller:
  ros__parameters:
    joints:
      - linear_actuator_to_linear_actuator_plate_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
