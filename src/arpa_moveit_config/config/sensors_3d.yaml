sensors:
  - default_sensor
default_sensor:
  far_clipping_plane_distance: 10
  filtered_cloud_topic: /ur/realsense_depth_filtered
  image_topic: /ur/realsense_depth
  max_update_rate: 30
  near_clipping_plane_distance: 0.3
  padding_offset: 0.1
  padding_scale: 0.1
  queue_size: 1
  sensor_plugin: occupancy_map_monitor/DepthImageOctomapUpdater
  shadow_threshold: 0.5