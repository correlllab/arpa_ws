controller_manager:
  ros__parameters:
    update_rate: 100  # Hz

    # List of controllers
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    # forward_position_controller:
    #   type: position_controllers/JointGroupPositionController

    joint_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

# Joint State Broadcaster - publishes joint states to /joint_states
joint_state_broadcaster:
  ros__parameters:
    joints:
      - linear_actuator_to_linear_actuator_plate_joint
    interfaces:
      - position

# Position Controller - accepts position commands
# forward_position_controller:
#   ros__parameters:
#     joints:
#       - linear_actuator_to_linear_actuator_plate_joint
#     command_interfaces:
#       - position
#     state_interfaces:
#       - position
#       - velocity


joint_trajectory_controller:
  ros__parameters:
    joints:
      - linear_actuator_to_linear_actuator_plate_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    state_publish_rate: 100.0
    action_monitor_rate: 1.0
    allow_partial_joints_goal: false
    constraints:
      stopped_velocity_tolerance: 0.3
      goal_time: 0.0
      linear_actuator_to_linear_actuator_plate_joint: { trajectory: 0.5, goal: 0.01 }