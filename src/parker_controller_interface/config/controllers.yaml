controller_manager:
  ros__parameters:
    update_rate: 100  # Hz

    # List of controllers
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    position_controller:
      type: position_controllers/JointGroupPositionController

    velocity_controller:
      type: velocity_controllers/JointGroupVelocityController

    effort_controller:
      type: effort_controllers/JointGroupEffortController

# Joint State Broadcaster - publishes joint states to /joint_states
joint_state_broadcaster:
  ros__parameters:
    joints:
      - linear_actuator_joint
    interfaces:
      - position
      - velocity
      - effort

# Position Controller - accepts position commands
position_controller:
  ros__parameters:
    joints:
      - linear_actuator_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity

# Velocity Controller - accepts velocity commands
velocity_controller:
  ros__parameters:
    joints:
      - linear_actuator_joint
    command_interfaces:
      - velocity
    state_interfaces:
      - position
      - velocity

# Effort Controller - accepts effort/force commands
effort_controller:
  ros__parameters:
    joints:
      - linear_actuator_joint
    command_interfaces:
      - effort
    state_interfaces:
      - position
      - velocity
      - effort
